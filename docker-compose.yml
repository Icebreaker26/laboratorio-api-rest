services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laboratorio_api
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api-backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mi-api-backend:
    build: ./api-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/laboratorio_api
    depends_on:
      db:
        condition: service_healthy

  mi-web-frontend:
    build: ./app-frontend
    ports:
      - "8082:80"
    depends_on:
      - mi-api-backend

volumes:
  db_data:
